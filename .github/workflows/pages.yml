name: Deploy preview to GitHub Pages

# Publishes the playable prototype (preview/index.html) to GitHub Pages so it
# can be shared with a link. One-time setup required in the repo:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
on:
  push:
    branches: ["**"]
    paths: ["preview/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: preview
      - id: deployment
        uses: actions/deploy-pages@v4
