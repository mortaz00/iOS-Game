name: Publish prototype to GitHub Pages

# Pages serves from the gh-pages branch (classic mode, auto-enabled).
# This workflow keeps that branch in sync: any change to preview/ on the
# development branch is force-pushed to gh-pages as a fresh single commit.
on:
  push:
    branches: ["claude/mobile-game-ads-iap-3qiosv"]
    paths: ["preview/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push preview to gh-pages
        run: |
          mkdir -p /tmp/site
          cp preview/index.html /tmp/site/index.html
          touch /tmp/site/.nojekyll
          cd /tmp/site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish prototype ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
