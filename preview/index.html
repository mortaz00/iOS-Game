<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Gem Miner: Deep Descent — Playable Prototype</title>
<style>
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html, body { height:100%; background:#05050d; overflow:hidden; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; display:flex; justify-content:center; }
  #game { position:relative; width:100%; max-width:440px; height:100vh; height:100dvh; overflow:hidden; background:#000; }
  canvas { position:absolute; inset:0; touch-action:none; }

  /* ---------- HUD ---------- */
  #hud {
    position:absolute; top:env(safe-area-inset-top,8px); left:0; right:0; padding:10px 12px 0;
    display:flex; justify-content:space-between; gap:8px; z-index:10; pointer-events:none;
  }
  .pill {
    display:flex; align-items:center; gap:6px; padding:7px 12px; border-radius:999px;
    background:rgba(10,12,24,.72); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.09);
    color:#fff; font-weight:800; font-size:14px; box-shadow:0 2px 10px rgba(0,0,0,.4);
  }
  .pill svg { width:16px; height:16px; flex:none; }
  #depth-pill { color:#9fd8ff; }

  #energy-wrap {
    position:absolute; top:calc(env(safe-area-inset-top,8px) + 52px); left:12px; right:12px; height:16px;
    border-radius:999px; background:rgba(10,12,24,.72); border:1px solid rgba(255,255,255,.09);
    overflow:hidden; z-index:10;
  }
  #energy-bar {
    height:100%; width:100%; border-radius:999px;
    background:linear-gradient(90deg,#19e3b1,#7cf2c8); transition:width .2s;
    box-shadow:0 0 12px rgba(25,227,177,.55);
  }
  #energy-wrap.low #energy-bar { background:linear-gradient(90deg,#ff5252,#ff9b52); animation:blink .5s infinite alternate; }
  @keyframes blink { from{opacity:1} to{opacity:.55} }
  #energy-label {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:10px; font-weight:800; color:#04261c; letter-spacing:.4px;
  }
  #energy-wrap.low #energy-label { color:#3a0d05; }

  #chips { position:absolute; top:calc(env(safe-area-inset-top,8px) + 76px); left:0; right:0;
    display:flex; justify-content:center; gap:6px; z-index:10; pointer-events:none; }
  .chip { font-size:11px; font-weight:800; padding:4px 10px; border-radius:999px; backdrop-filter:blur(6px); }
  .chip.frenzy { background:rgba(255,200,40,.22); color:#ffd54a; border:1px solid rgba(255,213,74,.4); }
  .chip.boost  { background:rgba(80,200,255,.18); color:#7ad7ff; border:1px solid rgba(122,215,255,.4); }
  .chip.relic  { background:rgba(190,120,255,.18); color:#cf9bff; border:1px solid rgba(207,155,255,.4); }

  #combo {
    position:absolute; top:34%; left:50%; transform:translateX(-50%); z-index:10; pointer-events:none;
    font-weight:900; font-size:26px; color:#ffd54a; text-shadow:0 0 18px rgba(255,160,20,.9),0 2px 4px #000;
    opacity:0; transition:opacity .2s, transform .15s;
  }
  #combo.show { opacity:1; }

  /* ---------- Controls ---------- */
  #controls {
    position:absolute; left:0; right:0; bottom:calc(env(safe-area-inset-bottom,10px) + 8px);
    display:flex; align-items:flex-end; justify-content:space-between; padding:0 16px; z-index:10;
  }
  .round-btn {
    width:58px; height:58px; border-radius:50%; border:1px solid rgba(255,255,255,.14);
    background:linear-gradient(160deg,#222438,#14152a); cursor:pointer; position:relative;
    display:flex; align-items:center; justify-content:center; box-shadow:0 4px 14px rgba(0,0,0,.5);
  }
  .round-btn svg { width:26px; height:26px; }
  .round-btn:active { transform:scale(.92); }
  .badge {
    position:absolute; top:-3px; right:-3px; min-width:18px; height:18px; border-radius:9px;
    background:#ff3b6b; color:#fff; font-size:11px; font-weight:800;
    display:none; align-items:center; justify-content:center; padding:0 4px;
  }
  .badge.on { display:flex; }

  #dpad { display:grid; grid-template-columns:repeat(3,56px); grid-template-rows:repeat(2,52px); gap:6px; }
  .btn-col { display:flex; flex-direction:column; gap:10px; align-items:center; }
  #joy {
    width:128px; height:128px; border-radius:50%; position:relative; touch-action:none;
    background:radial-gradient(circle at 50% 40%, rgba(56,60,100,.55), rgba(16,18,36,.75));
    border:1px solid rgba(255,255,255,.14); box-shadow:0 6px 18px rgba(0,0,0,.5);
  }
  #joy-knob {
    position:absolute; left:50%; top:50%; width:56px; height:56px; margin:-28px 0 0 -28px;
    border-radius:50%; pointer-events:none;
    background:linear-gradient(160deg,#3a3f6b,#1d2040);
    border:1px solid rgba(255,255,255,.22); box-shadow:0 4px 12px rgba(0,0,0,.6);
  }
  #joy.active #joy-knob { background:linear-gradient(160deg,#ff9d3f,#ff5e62); }
  #bomb-count {
    position:absolute; top:-3px; right:-3px; min-width:18px; height:18px; border-radius:9px;
    background:#ffd24a; color:#321; font-size:11px; font-weight:800;
    display:flex; align-items:center; justify-content:center; padding:0 4px;
  }
  #btn-start {
    position:absolute; left:50%; transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom,10px) + 168px);
    border:none; border-radius:18px; padding:14px 30px; z-index:11; cursor:pointer;
    font-size:17px; font-weight:900; color:#fff; letter-spacing:.5px;
    background:linear-gradient(135deg,#ff9d3f,#ff5e62);
    box-shadow:0 8px 30px rgba(255,94,98,.5); display:none;
    animation:startPulse 1.2s ease-in-out infinite alternate;
  }
  @keyframes startPulse { from{transform:translateX(-50%) scale(1)} to{transform:translateX(-50%) scale(1.06)} }

  .round-btn.leave { background:linear-gradient(160deg,#ff5e62,#b3232f); }

  /* ---------- Social ---------- */
  .tabs { display:flex; gap:6px; margin-bottom:14px; }
  .tab {
    flex:1; padding:9px 4px; border-radius:12px; border:none; cursor:pointer;
    background:rgba(255,255,255,.06); color:#8d93b8; font-weight:800; font-size:12px;
  }
  .tab.on { background:linear-gradient(135deg,#ff9d3f,#ff5e62); color:#fff; }
  .ava {
    width:38px; height:38px; border-radius:50%; flex:none; font-size:15px;
    display:flex; align-items:center; justify-content:center; font-weight:900; color:#fff;
  }
  .target-card {
    border-radius:18px; padding:16px; text-align:center; margin-bottom:10px;
    background:linear-gradient(135deg,#1c2a4a,#14182e); border:1px solid rgba(255,255,255,.12);
  }
  .rank { width:26px; text-align:center; font-weight:900; color:#8d93b8; flex:none; }
  #modal input {
    user-select:text; -webkit-user-select:text; width:100%; padding:11px 14px; border-radius:12px;
    margin-bottom:8px; border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.06); color:#fff; font-size:14px;
  }

  /* ---------- Banner / toast ---------- */
  #banner {
    position:absolute; top:23%; left:50%; transform:translate(-50%,0) scale(.7); z-index:20;
    padding:14px 26px; border-radius:18px; text-align:center; opacity:0; pointer-events:none;
    background:linear-gradient(135deg,rgba(124,47,247,.95),rgba(255,45,120,.95));
    color:#fff; font-weight:900; box-shadow:0 8px 40px rgba(124,47,247,.6);
    transition:opacity .25s, transform .25s;
  }
  #banner.show { opacity:1; transform:translate(-50%,0) scale(1); }
  #banner .sub { font-size:12px; font-weight:700; opacity:.9; margin-top:3px; }

  #toast {
    position:absolute; top:calc(env(safe-area-inset-top,8px) + 104px); left:50%; transform:translateX(-50%);
    background:rgba(20,24,40,.95); border:1px solid rgba(255,255,255,.14); color:#fff;
    font-weight:700; font-size:13px; padding:9px 16px; border-radius:999px; z-index:30;
    display:none; white-space:nowrap; box-shadow:0 4px 18px rgba(0,0,0,.5);
  }

  /* ---------- Modals ---------- */
  #modal {
    position:absolute; inset:0; z-index:40; background:rgba(0,0,5,.6); backdrop-filter:blur(3px);
    display:flex; align-items:flex-end; opacity:0; pointer-events:none; transition:opacity .2s;
  }
  #modal.open { opacity:1; pointer-events:auto; }
  #modal-card {
    width:100%; max-height:78%; overflow-y:auto; border-radius:24px 24px 0 0; padding:20px 16px 30px;
    background:linear-gradient(180deg,#171a2e,#0e1020); border-top:1px solid rgba(255,255,255,.12);
    color:#fff; transform:translateY(40px); transition:transform .22s;
  }
  #modal.open #modal-card { transform:translateY(0); }
  .m-title { font-size:21px; font-weight:900; text-align:center; margin-bottom:4px; }
  .m-sub { font-size:12px; color:#8d93b8; text-align:center; margin-bottom:14px; }
  .m-close {
    position:sticky; top:0; float:right; width:30px; height:30px; border-radius:50%;
    border:none; background:rgba(255,255,255,.1); color:#aab; font-size:15px; cursor:pointer;
  }

  .u-row {
    display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:16px;
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.07); margin-bottom:9px;
  }
  .u-icon {
    width:42px; height:42px; border-radius:12px; flex:none;
    display:flex; align-items:center; justify-content:center;
  }
  .u-icon svg { width:24px; height:24px; }
  .u-info { flex:1; min-width:0; }
  .u-name { font-weight:800; font-size:14px; }
  .u-sub { font-size:11.5px; color:#8d93b8; margin-top:2px; }
  .u-btn {
    border:none; border-radius:999px; padding:9px 14px; font-weight:800; font-size:13px;
    color:#fff; background:linear-gradient(135deg,#2ecc71,#1ca35a); cursor:pointer; min-width:78px;
    display:flex; align-items:center; justify-content:center; gap:5px;
  }
  .u-btn svg { width:13px; height:13px; }
  .u-btn:disabled { background:rgba(255,255,255,.12); color:#778; }
  .u-btn.gems { background:linear-gradient(135deg,#ff5f9e,#d63a78); }
  .u-btn.iap  { background:linear-gradient(135deg,#3a8bff,#2a64d8); }
  .u-btn.ad   { background:linear-gradient(135deg,#ff9d3f,#ff5e62); }

  .big-cta {
    display:flex; flex-direction:column; align-items:center; gap:2px; width:100%;
    border:none; border-radius:16px; padding:14px; margin-top:8px; cursor:pointer;
    font-weight:900; font-size:15px; color:#fff;
    background:linear-gradient(135deg,#ff9d3f,#ff5e62); box-shadow:0 6px 24px rgba(255,94,98,.35);
  }
  .big-cta .s { font-size:11.5px; font-weight:700; opacity:.92; }
  .big-cta.alt { background:rgba(255,255,255,.09); box-shadow:none; }
  .big-cta.purple { background:linear-gradient(135deg,#7b2ff7,#ff2d78); box-shadow:0 6px 24px rgba(123,47,247,.35); }
  .big-cta:disabled { filter:grayscale(.8); opacity:.55; }

  .starter {
    border-radius:18px; padding:16px; text-align:center; margin-bottom:12px;
    background:linear-gradient(135deg,#5b21d6,#2d2a8c);
    border:1px solid rgba(255,255,255,.18); box-shadow:0 6px 30px rgba(91,33,214,.45);
  }
  .starter .t { font-weight:900; font-size:16px; letter-spacing:.5px; }
  .starter .timer { color:#ffd54a; font-size:12px; font-weight:800; margin:7px 0 11px; }

  .reward-big {
    font-size:34px; font-weight:900; text-align:center; margin:14px 0;
    background:linear-gradient(#7ad7ff,#cf9bff); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .sec-label { font-size:11px; font-weight:900; letter-spacing:1.2px; color:#8d93b8; margin:16px 4px 8px; }

  /* ---------- Ad overlay ---------- */
  #ad-overlay {
    position:absolute; inset:0; z-index:60; background:rgba(2,2,8,.96);
    display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    color:#fff; text-align:center;
  }
  #ad-overlay .ring {
    width:88px; height:88px; border-radius:50%; border:4px solid rgba(255,255,255,.15);
    border-top-color:#ff9d3f; animation:spin 1s linear infinite;
    display:flex; align-items:center; justify-content:center;
  }
  #ad-overlay .ring svg { width:34px; height:34px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #ad-overlay .note { color:#667; font-size:11.5px; max-width:250px; }
</style>
</head>
<body>
<div id="game">
  <canvas id="cv"></canvas>

  <div id="hud">
    <div class="pill" id="cash-pill"></div>
    <div class="pill" id="depth-pill"></div>
    <div class="pill" id="gems-pill"></div>
  </div>
  <div id="energy-wrap"><div id="energy-bar"></div><div id="energy-label"></div></div>
  <div id="chips"></div>
  <div id="combo"></div>
  <div id="banner"></div>
  <div id="toast"></div>

  <button id="btn-start">START</button>
  <div id="controls">
    <div class="btn-col">
      <button class="round-btn" id="btn-upg"><span class="badge" id="upg-badge">!</span></button>
      <button class="round-btn" id="btn-bomb"><span id="bomb-count">0</span></button>
    </div>
    <div id="joy"><div id="joy-knob"></div></div>
    <div class="btn-col">
      <button class="round-btn" id="btn-social"><span class="badge" id="soc-badge">!</span></button>
      <button class="round-btn" id="btn-shop"></button>
    </div>
  </div>

  <div id="modal"><div id="modal-card"></div></div>
  <div id="ad-overlay">
    <div class="ring" id="ad-ring"></div>
    <div style="font-size:18px;font-weight:800">Simulated ad &bull; <span id="ad-secs">3</span>s</div>
    <div class="note">The iOS build plays a real rewarded video here (AdMob).</div>
  </div>
</div>

<script>
"use strict";
// Surface any startup error on screen (mobile browsers hide the console)
window.addEventListener("error",function(e){
 var d=document.createElement("div");
 d.style.cssText="position:fixed;top:0;left:0;right:0;z-index:9999;background:#a00;color:#fff;font:12px monospace;padding:8px;white-space:pre-wrap;";
 d.textContent="Error: "+(e.message||e.type)+(e.filename?" @"+e.lineno:"");
 document.body.appendChild(d);
});
// Tester backdoor: open the game with ?reset in the URL to wipe the save.
// No in-game reset exists for players.
if(location.search.indexOf("reset")>-1){
 try{ localStorage.removeItem("gm-deep"); }catch(e){}
 location.replace(location.pathname);
}
/* =================== Helpers =================== */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);
const SUF=["","K","M","B","T","Qa","Qi"];
function fmt(n){ if(n<1000) return n<10&&n!==Math.round(n)?n.toFixed(1):Math.round(n)+"";
  let i=0; while(n>=1000&&i<SUF.length-1){n/=1000;i++;}
  return n.toFixed(n>=100?0:n>=10?1:2)+SUF[i]; }
function dur(s){ s=Math.max(0,Math.floor(s));
  if(s>=3600) return Math.floor(s/3600)+"h "+Math.floor(s%3600/60)+"m";
  if(s>=60) return Math.floor(s/60)+"m "+(s%60)+"s"; return s+"s"; }
const nowS=()=>Date.now()/1000;

/* =================== SVG icons (no emojis) =================== */
const IC={
coin:c=>`<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="${c||'#ffd24a'}"/><circle cx="12" cy="12" r="6.5" fill="none" stroke="rgba(120,70,0,.55)" stroke-width="2"/><path d="M12 8v8M9.7 9.8h3.4a1.7 1.7 0 010 3.4H11a1.7 1.7 0 000 3.4h3.3" stroke="rgba(120,70,0,.8)" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>`,
gem:c=>`<svg viewBox="0 0 24 24"><path d="M12 2L21 9.5 12 22 3 9.5z" fill="${c||'#ff5f9e'}"/><path d="M12 2l3.5 7.5L12 22 8.5 9.5z" fill="rgba(255,255,255,.35)"/></svg>`,
bolt:c=>`<svg viewBox="0 0 24 24"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z" fill="${c||'#19e3b1'}"/></svg>`,
drill:c=>`<svg viewBox="0 0 24 24" fill="none" stroke="${c||'#ffb14a'}" stroke-width="2" stroke-linecap="round"><path d="M3 21l6-6M9 15l6 2 6-6-8-8-6 6 2 6z"/><path d="M13 3l8 8"/></svg>`,
tank:c=>`<svg viewBox="0 0 24 24" fill="none" stroke="${c||'#19e3b1'}" stroke-width="2" stroke-linecap="round"><rect x="5" y="4" width="14" height="17" rx="3"/><path d="M9 2h6M12 9v6M9.5 11.5L12 9l2.5 2.5"/></svg>`,
regen:c=>`<svg viewBox="0 0 24 24" fill="none" stroke="${c||'#7ad7ff'}" stroke-width="2" stroke-linecap="round"><path d="M20 11a8 8 0 10.6 4"/><path d="M20 4v7h-7"/></svg>`,
robot:c=>`<svg viewBox="0 0 24 24" fill="none" stroke="${c||'#cf9bff'}" stroke-width="2" stroke-linecap="round"><rect x="5" y="8" width="14" height="11" rx="3"/><circle cx="9.5" cy="13" r="1.3" fill="${c||'#cf9bff'}" stroke="none"/><circle cx="14.5" cy="13" r="1.3" fill="${c||'#cf9bff'}" stroke="none"/><path d="M12 8V4M8 4h8M8 22v-3M16 22v-3"/></svg>`,
play:c=>`<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="${c||'#fff'}"/></svg>`,
bag:c=>`<svg viewBox="0 0 24 24" fill="none" stroke="${c||'#7ad7ff'}" stroke-width="2" stroke-linecap="round"><path d="M5 8h14l-1.2 12a2 2 0 01-2 1.8H8.2a2 2 0 01-2-1.8L5 8z"/><path d="M8.5 10V6.5a3.5 3.5 0 017 0V10"/></svg>`,
chest:c=>`<svg viewBox="0 0 24 24" fill="none" stroke="${c||'#ffd24a'}" stroke-width="2" stroke-linecap="round"><rect x="3" y="6" width="18" height="14" rx="2.5"/><path d="M3 12h18M12 10.5v3.5"/></svg>`,
arrow:r=>`<svg viewBox="0 0 24 24" style="transform:rotate(${r}deg)" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>`,
relic:c=>`<svg viewBox="0 0 24 24"><path d="M12 2l2.6 6.8L21 11l-6.4 2.2L12 20l-2.6-6.8L3 11l6.4-2.2z" fill="${c||'#cf9bff'}"/></svg>`,
depth:c=>`<svg viewBox="0 0 24 24" fill="none" stroke="${c||'#9fd8ff'}" stroke-width="2" stroke-linecap="round"><path d="M12 3v14M7 12l5 5 5-5"/><path d="M4 21h16"/></svg>`,
shield:c=>`<svg viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5-3.4 9.2-8 11-4.6-1.8-8-6-8-11V5z" fill="${c||'#7ad7ff'}"/><path d="M12 2l8 3v6c0 5-3.4 9.2-8 11z" fill="rgba(255,255,255,.18)"/></svg>`,
raid:c=>`<svg viewBox="0 0 24 24" fill="none" stroke="${c||'#ff7a5c'}" stroke-width="2.2" stroke-linecap="round"><path d="M4 4l13 13M20 4L7 17"/><path d="M15.5 18.5l3-3M5.5 15.5l3 3"/><circle cx="18" cy="19" r="1.6"/><circle cx="6" cy="19" r="1.6"/></svg>`,
trophy:c=>`<svg viewBox="0 0 24 24" fill="none" stroke="${c||'#ffd24a'}" stroke-width="2" stroke-linecap="round"><path d="M8 4h8v5a4 4 0 01-8 0z"/><path d="M8 5H4.5a3.5 3.5 0 003.5 5M16 5h3.5a3.5 3.5 0 01-3.5 5"/><path d="M12 13v4M8 21h8M10 17h4v4h-4z"/></svg>`,
users:c=>`<svg viewBox="0 0 24 24" fill="none" stroke="${c||'#7ad7ff'}" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M3 20a6 6 0 0112 0"/><circle cx="17" cy="9" r="2.6"/><path d="M15.5 14.6A5.5 5.5 0 0121 20"/></svg>`,
};

/* =================== Tiles & balance =================== */
const COLS=9;
const T={EMPTY:0,DIRT:1,CLAY:2,STONE:3,OBSIDIAN:4,GOLD:5,EMERALD:6,RUBY:7,SAPPHIRE:8,DIAMOND:9,CHEST:10,ENERGY:11,BEDROCK:12,VAULT:13,MONSTER:14,RELIC:15};
const TDEF={
 [T.DIRT]:    {hp:30, cost:3, top:"#9c6b33", bot:"#6f4a20"},
 [T.CLAY]:    {hp:55, cost:4, top:"#a8593a", bot:"#73381f"},
 [T.STONE]:   {hp:120,cost:7, top:"#6f7787", bot:"#454c5c"},
 [T.OBSIDIAN]:{hp:280,cost:12,top:"#473d63", bot:"#241d38"},
 [T.GOLD]:    {hp:60, cost:5, gem:"#ffd24a", value:10,  name:"Gold"},
 [T.EMERALD]: {hp:90, cost:6, gem:"#3ddc84", value:26,  name:"Emerald"},
 [T.RUBY]:    {hp:130,cost:8, gem:"#ff4d6d", value:62,  name:"Ruby"},
 [T.SAPPHIRE]:{hp:190,cost:10,gem:"#4d79ff", value:150, name:"Sapphire"},
 [T.DIAMOND]: {hp:280,cost:13,gem:"#b9f2ff", value:420, name:"Diamond"},
 [T.CHEST]:   {hp:50, cost:4, gem:"#ffd24a"},

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
 t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}

function genTile(d){
 const r=RNG();
 let base = d<25?T.DIRT : d<60?(r<0.6?T.DIRT:T.CLAY) : d<140?(RNG()<0.55?T.CLAY:T.STONE)
          : d<280?(RNG()<0.6?T.STONE:T.OBSIDIAN) : T.OBSIDIAN;
 const roll=RNG();
 if(d>2&&roll<0.012) return T.CHEST;
 if(d>4&&roll<0.012+0.035) return T.ENERGY;
 if(d>15&&roll<0.047+0.009) return T.MONSTER;   // cave monsters guard the depths
 const oreP=0.10+Math.min(0.15,d/800);
 if(roll<0.056+oreP){
   const avail=[];
   if(d>=5) avail.push([T.GOLD,5]);
   if(d>=30) avail.push([T.EMERALD,4]);
   if(d>=70) avail.push([T.RUBY,3]);
   if(d>=140) avail.push([T.SAPPHIRE,2]);
   if(d>=220) avail.push([T.DIAMOND,1]);
   if(avail.length){
     let tot=avail.reduce((a,x)=>a+x[1],0), pick=RNG()*tot;
     for(const [t,w] of avail){ pick-=w; if(pick<=0) return t; }
   }
 }
 return base;
}
function getRow(r){
 if(!rows[r]){ rows[r]=[]; for(let c=0;c<COLS;c++){
   let t = r<0?T.EMPTY : (raid&&r>=RAID_ROWS)?T.BEDROCK : genTile(r+1);
   // rock toughens with depth, and every relic hardens the whole world (NG+)
   const hp=t===T.EMPTY?0:TDEF[t].hp*(1+Math.max(0,r)/300)*(1+BAL.relicWorldHp*S.relics);
   rows[r].push({t,hp,maxHp:hp||1});
 }} return rows[r];
}
const getTile=(c,r)=> (c<0||c>=COLS)?null : r<0?{t:T.EMPTY}:getRow(r)[c];

function buildSprites(){
 for(const k of Object.keys(TDEF)){
  const t=+k, d=TDEF[t], s=document.createElement("canvas");
  s.width=s.height=Math.ceil(TS*dpr); const c=s.getContext("2d"); c.scale(dpr,dpr);
  const host = t===T.GOLD?TDEF[T.CLAY] : t>=T.EMERALD&&t<=T.DIAMOND?TDEF[T.STONE]
             : t===T.CHEST||t===T.ENERGY?TDEF[T.DIRT] : t===T.VAULT?TDEF[T.STONE] : d;
  const g=c.createLinearGradient(0,0,0,TS);
  g.addColorStop(0,host.top||"#888"); g.addColorStop(1,host.bot||"#555");
  c.fillStyle=g; c.fillRect(0,0,TS,TS);
  for(let i=0;i<14;i++){ c.fillStyle=`rgba(${Math.random()<0.5?0:255},${Math.random()<0.5?0:255},255,${rand(0.03,0.08)})`;
    c.fillRect(rand(2,TS-4),rand(2,TS-4),rand(1.5,3.5),rand(1.5,3.5)); }
  c.fillStyle="rgba(255,255,255,.13)"; c.fillRect(0,0,TS,2.5);
  c.fillStyle="rgba(0,0,0,.28)"; c.fillRect(0,TS-3,TS,3);
  c.fillRect(TS-2.5,0,2.5,TS);
  if(d.gem&&t!==T.CHEST&&t!==T.ENERGY&&t!==T.VAULT){ drawGem(c,TS/2,TS/2,TS*0.3,d.gem); }
  if(t===T.ENERGY){ drawBoltShape(c,TS/2,TS/2,TS*0.3); }
  if(t===T.CHEST){ drawChest(c,TS/2,TS/2,TS*0.62); }
  if(t===T.VAULT){ drawVault(c,TS); }
  if(t===T.MONSTER){ drawMonster(c,TS); }
  if(t===T.RELIC){
    // disguised as stone: only a faint purple shimmer betrays it
    c.fillStyle="rgba(207,155,255,.18)";
    for(let i=0;i<5;i++) c.fillRect(rand(4,TS-6),rand(4,TS-6),2,2);
  }
  if(t===T.BEDROCK){
    c.strokeStyle="rgba(255,255,255,.06)"; c.lineWidth=4;
    for(let i=-1;i<4;i++){ c.beginPath(); c.moveTo(i*TS*0.4,TS); c.lineTo(i*TS*0.4+TS*0.5,0); c.stroke(); }
  }
  sprites[t]=s;
 }
}
function drawGem(c,x,y,r,col){

function roundRect(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r);
 c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function drawMonster(c,sz){

  const x=sz/2+Math.cos(a)*sz*0.27, y=sz*0.56-Math.sin(a)*sz*0.27;

  c.closePath(); c.fill(); }
 c.shadowColor="#ff4d6d"; c.shadowBlur=8; c.fillStyle="#ff4d6d";
 c.beginPath(); c.arc(sz*0.42,sz*0.5,sz*0.05,0,7); c.fill();
 c.beginPath(); c.arc(sz*0.6,sz*0.5,sz*0.05,0,7); c.fill();
 c.shadowBlur=0;
 c.fillStyle="#fff";
 for(let i=0;i<4;i++){ const x=sz*0.38+i*sz*0.08;
  c.beginPath(); c.moveTo(x,sz*0.66); c.lineTo(x+sz*0.045,sz*0.66);
  c.lineTo(x+sz*0.022,sz*0.74); c.closePath(); c.fill(); }

}

function collect(tile,c,r){
 const cx=c*TS+TS/2, cy=r*TS+TS/2;
 const d=depthOf(r), def=TDEF[tile.t];
 if(tile.t===T.MONSTER){
   const v=80*BAL.oreScale(d)*incomeMult();
   if(raid){ raid.loot+=v; } else {
     levelPot+=v;
     if(Math.random()<0.25&&S.bombs<BAL.bombMax){ S.bombs++; toast("The monster dropped a bomb!"); }
   }
   addFloat(cx,cy,"SLAIN! +"+fmt(v),"#ff4d6d",18);
   sparkle(cx,cy,"#ff4d6d",22); shake=4;
   if(navigator.vibrate) navigator.vibrate(25);
   return;
 }
 if(raid){
   if(tile.t===T.RELIC){
     raid.relicStolen=true; S.relics++;
     addFloat(cx,cy,"RELIC! ✦","#cf9bff",24);
     sparkle(cx,cy,"#cf9bff",34); shake=6;
     banner("RELIC STOLEN! ✦","+1 relic — "+raid.name+" loses it forever");
     return;
   }
   if(tile.t===T.VAULT){
     const take=raid.stock*rand(0.08,0.13)*(raid.revenge?1.5:1);
     raid.loot+=take; raid.vaults--;
     addFloat(cx,cy,"VAULT! +"+fmt(take),"#ffd24a",22);
     sparkle(cx,cy,"#ffd24a",30); shake=5;
     if(navigator.vibrate) navigator.vibrate(30);
     if(raid.vaults<=0) setTimeout(()=>{ if(raid) endRaid(); },650);
     return;
   }
   if(tile.t===T.CHEST){
     const take=raid.stock*0.03;
     raid.loot+=take; addFloat(cx,cy,"+"+fmt(take),"#ffd24a",16); sparkle(cx,cy,"#ffd24a",16);
     return;
   }
   if(tile.t===T.ENERGY){ sparkle(cx,cy,"#19e3b1",10); return; }
   if(def.value){
     bumpCombo();
     const v=def.value*BAL.oreScale(d)*incomeMult()*comboMult();
     raid.loot+=v;
     addFloat(cx,cy,"+"+fmt(v),def.gem,combo>=4?20:15);
     sparkle(cx,cy,def.gem,14);
   }
   return;
 }
 if(tile.t===T.CHEST){ openChest(d); sparkle(cx,cy,"#ffd24a",26); return; }
 if(tile.t===T.ENERGY){ S.energy=clamp(S.energy+30,0,maxEnergy());
   addFloat(cx,cy,"+30","#19e3b1",15); sparkle(cx,cy,"#19e3b1",14); return; }
 if(def.value){
   bumpCombo();
   const v=def.value*BAL.oreScale(d)*incomeMult()*comboMult()*(frenzyOn()?2:1);
   levelPot+=v;
   addFloat(cx,cy,"+"+fmt(v),def.gem,combo>=4?20:15);
   sparkle(cx,cy,def.gem,18);
   if(navigator.vibrate) navigator.vibrate(12);
 }
}

function tryDig(dt){
 if(drill.anim||modalOpen) return;
 if(!inLevel&&!raid) return;   // digging only happens during a level or a raid
 const below=getTile(drill.col,drill.row+1);
 if(below&&below.t===T.EMPTY&&!held){ startMove(0,1,0.16); return; }
 if(!held) return;
 const [dx,dy]=held; drill.dir=held;
 if(dy===-1&&!wingsOn()) return;   // climbing requires the wings powerup
 const nc=drill.col+dx, nr=drill.row+dy;
 if(nc<0||nc>=COLS||nr<-1) return;
 const tile=getTile(nc,nr);
 if(!tile) return;
 // deliberate pacing: sideways slower than down
 if(tile.t===T.EMPTY){ startMove(dx,dy,dy===0?0.28:0.2); return; }
 if(dy===-1) return; // can't dig upward even with wings
 const def=TDEF[tile.t];
 if(!isFinite(tile.hp)){ // bedrock: raid boundary
   if(Math.random()<dt*8) sparkle(nc*TS+TS/2,nr*TS+TS/2,"#8d93b8",2);
   return;
 }
 if(!raid&&S.energy<def.cost){ held=null; openRefill(); return; }
 if(tile.t===T.MONSTER&&!raid){
   // it bites back: fighting drains energy fast
   S.energy=Math.max(0,S.energy-BAL.monsterDrain*dt);
   if(Math.random()<dt*6) spawnParts(nc*TS+TS/2,nr*TS+TS/2,"#ff4d6d",2,130);
   if(S.energy<=0){ held=null; openRefill(); return; }
 }
 tile.hp-=digPower()*dt*(frenzyOn()?2:1);
 drill.bitSpin+=dt*30;
 if(Math.random()<dt*22){
   const host=def.gem?(tile.t===T.GOLD?TDEF[T.CLAY]:TDEF[T.STONE]):def;
   spawnParts(nc*TS+TS/2,nr*TS+TS/2,host.bot||"#777",2,90);
 }
 if(def.hp>=100) shake=Math.min(shake+dt*14,4);
 if(tile.hp<=0){
   if(!raid) S.energy-=def.cost;
   collect(tile,nc,nr);
   tile.t=T.EMPTY;
   spawnParts(nc*TS+TS/2,nr*TS+TS/2,"#999",6,120);
   startMove(dx,dy,dx!==0?0.26:0.18);
   if(navigator.vibrate) navigator.vibrate(8);
 }
}
function startMove(dx,dy,t){
 drill.anim={fx:drill.px,fy:drill.py,tx:(drill.col+dx)*TS,ty:(drill.row+dy)*TS,t:0,dur:t};
 drill.col+=dx; drill.row+=dy;
 const d=depthOf(drill.row);
 if(!raid){
   if(inLevel) levelMaxDepth=Math.max(levelMaxDepth,d);
   if(d>S.bestDepth){ S.bestDepth=d; checkMilestones(d); }
 }
}

 else { name=BOTNAMES[Math.floor(Math.random()*BOTNAMES.length)];
        seed=(hashStr(name)+Math.floor(Date.now()/36e5))>>>0; }
 const rng=mulberry32(seed);

 const relics=rng()<0.55?1:0;

}

function buildRaidWorld(target){
 rows={}; RNG=mulberry32(target.seed);
 for(let r=0;r<RAID_ROWS;r++) getRow(r);
 const spots=[];
 while(spots.length<3){
  const c=Math.floor(RNG()*COLS), rr=4+Math.floor(RNG()*(RAID_ROWS-6));
  if(!spots.some(s=>s[0]===c&&s[1]===rr)) spots.push([c,rr]);
 }
 for(const [c,rr] of spots){ const tl=rows[rr][c];
  tl.t=T.VAULT; tl.hp=tl.maxHp=TDEF[T.VAULT].hp*(1+rr/100); }
 // hidden relic shrine: disguised as plain stone, somewhere off the vault path
 if(target.relics>0&&RNG()<0.8){
  for(let tries=0;tries<20;tries++){
   const c=Math.floor(RNG()*COLS), rr=8+Math.floor(RNG()*(RAID_ROWS-10));
   if(rows[rr][c].t!==T.VAULT){
    const tl=rows[rr][c];
    tl.t=T.RELIC; tl.hp=tl.maxHp=TDEF[T.RELIC].hp*(1+rr/100);
    break;
   }
  }
 }
 RNG=Math.random;
}

       endAt:nowS()+RAID_TIME, revenge:!!revenge, seed:target.seed};
 buildRaidWorld(target);
 drill.col=4; drill.row=-1; drill.anim=null;

function genRaidSteps(total,relic){
 const parts=2+Math.floor(Math.random()*2);
 const cuts=[]; let rem=total;
 for(let i=0;i<parts;i++){
  const a=i===parts-1?rem:total*rand(0.2,0.45);
  cuts.push(Math.min(a,rem)); rem-=cuts[i];
 }
 const steps=[{txt:"Breached your mine",amt:0}];
 cuts.forEach((a,i)=>steps.push({txt:"Cracked vault "+(i+1),amt:a}));
 if(relic) steps.push({txt:"Found your hidden relic shrine",amt:0,relic:true});
 steps.push({txt:"Escaped to the surface",amt:0});
 return steps;
}
function incomingRaid(){
 if(raid||S.cash<600) return;

 if(shieldOn()){
   feedPush({type:"block", name});
   banner("RAID BLOCKED!", "Your shield held against "+name);
 } else {
   let steal=S.cash*rand(0.03,0.07), usedDecoy=false, relicLost=false;
   if(S.decoys>0){ S.decoys--; steal*=0.5; usedDecoy=true; }
   if(!usedDecoy&&S.relics>0&&Math.random()<0.2){ S.relics--; relicLost=true; }
   S.cash-=steal;
   feedPush({type:"in", name, amt:steal, seed:hashStr(name), revenged:false,
             decoy:usedDecoy, relic:relicLost, steps:genRaidSteps(steal,relicLost)});
   banner(name.toUpperCase()+" RAIDED YOU!",
          "−"+fmt(steal)+(relicLost?" • they STOLE A RELIC ✦":usedDecoy?" • decoy halved it":"")+" • revenge in Rivals");
 }
 save();
}

/* =================== Input: virtual joystick =================== */
const joy=document.getElementById("joy"), knob=document.getElementById("joy-knob");
let joyPointer=null;
function joyMove(e){
 const r=joy.getBoundingClientRect();
 let dx=e.clientX-(r.left+r.width/2), dy=e.clientY-(r.top+r.height/2);
 const m=Math.hypot(dx,dy), max=r.width/2-10;
 if(m>max){ dx*=max/m; dy*=max/m; }
 knob.style.transform=`translate(${dx}px,${dy}px)`;
 if(m<16){ held=null; return; }   // dead zone
 if(Math.abs(dx)>Math.abs(dy)) held=[dx>0?1:-1,0];
 else held=[0,dy>0?1:-1];
}
function joyEnd(e){
 if(e.pointerId!==joyPointer) return;
 joyPointer=null; held=null;
 joy.classList.remove("active");
 knob.style.transform="translate(0,0)";
}
joy.addEventListener("pointerdown",e=>{
 e.preventDefault();
 joyPointer=e.pointerId;
 joy.setPointerCapture(e.pointerId);
 joy.classList.add("active");
 joyMove(e);
});
joy.addEventListener("pointermove",e=>{ if(e.pointerId===joyPointer) joyMove(e); });
joy.addEventListener("pointerup",joyEnd);
joy.addEventListener("pointercancel",joyEnd);

/* =================== Render =================== */
function biome(d){
 if(d<25) return ["#1b1206","#241808"];
 if(d<60) return ["#1f1009","#2a140b"];
 if(d<140) return ["#14161d","#1a1c26"];
 if(d<280) return ["#120e1d","#181226"];
 return ["#0d0716","#140a20"];
}
function draw(){
 ctx.setTransform(dpr,0,0,dpr,0,0);
 const sx=shake>0.1?rand(-shake,shake):0, sy=shake>0.1?rand(-shake,shake):0;
 ctx.translate(sx,sy);
 const centerD=depthOf(Math.floor((camY+H/2)/TS));
 const [c1,c2]=biome(centerD);
 const bg=ctx.createLinearGradient(0,0,0,H); bg.addColorStop(0,c1); bg.addColorStop(1,c2);
 ctx.fillStyle=bg; ctx.fillRect(-10,-10,W+20,H+20);

 // sky
 const surfY=0-camY;
 if(surfY>-TS){
  const sky=ctx.createLinearGradient(0,surfY-H*0.8,0,surfY);
  sky.addColorStop(0,"#0d2b54"); sky.addColorStop(0.7,"#2a6fb8"); sky.addColorStop(1,"#7db8e8");
  ctx.fillStyle=sky; ctx.fillRect(-10,-10,W+20,surfY+10);
  ctx.save(); ctx.shadowColor="#ffe9a8"; ctx.shadowBlur=40;
  ctx.fillStyle="#ffe9a8"; ctx.beginPath(); ctx.arc(W*0.78,surfY-H*0.32,26,0,7); ctx.fill(); ctx.restore();
  ctx.fillStyle="rgba(255,255,255,.85)";
  for(const [cx,cy,s] of [[W*0.2,-0.22,1],[W*0.55,-0.4,0.7],[W*0.05,-0.45,0.8]]){
   const y=surfY+cy*H;
   ctx.beginPath(); ctx.arc(cx,y,16*s,0,7); ctx.arc(cx+18*s,y-6*s,13*s,0,7); ctx.arc(cx+36*s,y,15*s,0,7); ctx.fill();
  }
  ctx.fillStyle="#3f7d2e"; ctx.fillRect(0,surfY-5,W,5); // grass lip
 }

 // tiles
 const r0=Math.floor(camY/TS)-1, r1=Math.ceil((camY+H)/TS)+1;
 for(let r=Math.max(0,r0);r<=r1;r++){
  const row=getRow(r);
  for(let c=0;c<COLS;c++){
   const tile=row[c]; if(tile.t===T.EMPTY) continue;
   const x=c*TS, y=r*TS-camY;
   ctx.drawImage(sprites[tile.t],x,y,TS,TS);
   const dmg=1-tile.hp/tile.maxHp;
   if(dmg>0.05){
    ctx.strokeStyle="rgba(0,0,0,"+(0.35+dmg*0.4)+")"; ctx.lineWidth=1.6;
    let s=(c*73856093^r*19349663)>>>0;
    const rnd=()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; };
    const n=1+Math.floor(dmg*3);
    for(let i=0;i<n;i++){
     ctx.beginPath(); let px=x+TS*(0.2+rnd()*0.6), py=y+TS*(0.2+rnd()*0.6);
     ctx.moveTo(px,py);
     for(let j=0;j<3;j++){ px+=(rnd()-0.5)*TS*0.5; py+=(rnd()-0.5)*TS*0.5; ctx.lineTo(px,py); }
     ctx.stroke();
    }
   }
  }
 }

 drawDrill();

 // particles
 for(const p of parts){
  ctx.globalAlpha=clamp(p.life/p.max,0,1);
  ctx.fillStyle=p.col; ctx.fillRect(p.x-p.size/2,p.y-camY-p.size/2,p.size,p.size);
 }
 ctx.globalAlpha=1;

 // darkness + headlamp
 const d=depthOf(drill.row);
 const dark=clamp((d-6)/90,0,0.82);
 if(dark>0.02){
  const cx=drill.px+TS/2, cy=drill.py-camY+TS/2;
  const g=ctx.createRadialGradient(cx,cy,TS*1.2,cx,cy,TS*4.5);
  g.addColorStop(0,"rgba(4,4,14,0)"); g.addColorStop(1,"rgba(4,4,14,"+dark+")");
  ctx.fillStyle=g; ctx.fillRect(-10,-10,W+20,H+20);
 }

 // floating texts
 for(const f of floats){
  ctx.globalAlpha=clamp(f.life,0,1);
  ctx.font="900 "+f.size+"px -apple-system,sans-serif";
  ctx.textAlign="center";
  ctx.lineWidth=3; ctx.strokeStyle="rgba(0,0,0,.6)";
  const y=f.y-camY-(1-f.life)*60;
  ctx.strokeText(f.text,f.x,y); ctx.fillStyle=f.col; ctx.fillText(f.text,f.x,y);
 }
 ctx.globalAlpha=1;
}
// Elite drills: layered hulls, energy wings, orbiting orbs, rings.
// `t` animates them in-game; thumbnails pass t=0.
function drawEliteWings(c,s,k,t){
 const flap=Math.sin(t*3)*s*0.05;
 c.save(); c.shadowColor=k.glow; c.shadowBlur=14; c.fillStyle=k.wingCol||k.glow;
 for(const side of [-1,1]){
  c.save(); c.scale(side,1);
  c.beginPath();
  if(k.wings==="scythe"){
   c.moveTo(s*0.18,-s*0.05);
   c.quadraticCurveTo(s*0.55,-s*0.34-flap, s*0.64,-s*0.02);
   c.quadraticCurveTo(s*0.45,-s*0.14-flap, s*0.2,s*0.1);
  } else if(k.wings==="flame"){
   c.moveTo(s*0.16,0);
   c.lineTo(s*0.5,-s*0.24-flap); c.lineTo(s*0.42,-flap*0.5);
   c.lineTo(s*0.62,s*0.1); c.lineTo(s*0.2,s*0.12);
  } else { // ice shards
   c.moveTo(s*0.16,-s*0.02); c.lineTo(s*0.5,-s*0.28-flap); c.lineTo(s*0.34,0);
   c.lineTo(s*0.6,s*0.06); c.lineTo(s*0.2,s*0.1);
  }
  c.closePath(); c.fill(); c.restore();
 }
 c.restore();
}
function drawEliteChassis(c,s,k,t){
 c.save();
 // hover glow base
 c.save(); c.shadowColor=k.glow; c.shadowBlur=10; c.strokeStyle=k.glow;
 c.globalAlpha=0.7; c.lineWidth=2.5;
 c.beginPath(); c.ellipse(0,s*0.32,s*0.26,s*0.06,0,0,7); c.stroke(); c.restore();
 if(k.wings) drawEliteWings(c,s,k,t);
 // spikes behind hull
 if(k.spikes){
  c.fillStyle=k.bot;
  for(let i=0;i<6;i++){ const a=-Math.PI*0.9+i*Math.PI*0.36;
   const x=Math.cos(a)*s*0.26, y=-s*0.04+Math.sin(a)*s*0.26;
   c.beginPath(); c.moveTo(x,y);
   c.lineTo(x+Math.cos(a)*s*0.14,y+Math.sin(a)*s*0.14);
   c.lineTo(x+Math.cos(a+0.5)*s*0.05,y+Math.sin(a+0.5)*s*0.05);
   c.closePath(); c.fill(); }
 }
 // hull
 c.shadowColor=k.glow; c.shadowBlur=18;
 const bg=c.createLinearGradient(0,-s*0.36,0,s*0.26);
 bg.addColorStop(0,k.top); bg.addColorStop(1,k.bot);
 c.fillStyle=bg;
 c.beginPath();
 switch(k.hull){
  case "diamond":
   c.moveTo(0,-s*0.38); c.lineTo(s*0.3,-s*0.05); c.lineTo(s*0.18,s*0.28);
   c.lineTo(-s*0.18,s*0.28); c.lineTo(-s*0.3,-s*0.05); c.closePath(); break;
  case "serpent":
   roundRect(c,-s*0.4,-s*0.16,s*0.8,s*0.34,s*0.17); break;
  case "dragon":
   c.moveTo(-s*0.34,s*0.22); c.lineTo(-s*0.3,-s*0.18); c.lineTo(-s*0.1,-s*0.32);
   c.lineTo(s*0.22,-s*0.28); c.lineTo(s*0.38,-s*0.05); c.lineTo(s*0.3,s*0.22); c.closePath(); break;
  default: // core
   c.arc(0,-s*0.02,s*0.24,0,7);
 }
 c.fill(); c.shadowBlur=0;
 c.strokeStyle="rgba(255,255,255,.3)"; c.lineWidth=1.5; c.stroke();
 // hull details
 if(k.hull==="diamond"){
  c.strokeStyle="rgba(255,255,255,.35)"; c.lineWidth=1;
  c.beginPath(); c.moveTo(0,-s*0.38); c.lineTo(0,s*0.28);
  c.moveTo(-s*0.3,-s*0.05); c.lineTo(s*0.3,-s*0.05); c.stroke();
 }
 if(k.hull==="serpent"){
  c.strokeStyle="rgba(0,0,0,.3)"; c.lineWidth=1.5;
  for(let i=-1;i<=1;i++){ c.beginPath(); c.moveTo(i*s*0.18,-s*0.16); c.lineTo(i*s*0.18,s*0.18); c.stroke(); }
 }
 if(k.hull==="dragon"){
  c.fillStyle=k.top;   // horns
  c.beginPath(); c.moveTo(-s*0.24,-s*0.22); c.lineTo(-s*0.32,-s*0.44); c.lineTo(-s*0.12,-s*0.3); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(s*0.02,-s*0.28); c.lineTo(s*0.0,-s*0.46); c.lineTo(s*0.16,-s*0.3); c.closePath(); c.fill();
  c.fillStyle="#ff4d6d";  // eye
  c.beginPath(); c.arc(s*0.22,-s*0.1,s*0.05,0,7); c.fill();
 }
 if(k.hull==="core"){
  c.fillStyle="rgba(255,255,255,.9)";
  c.beginPath(); c.arc(0,-s*0.02,s*0.1,0,7); c.fill();
 }
 // rotating ring
 if(k.ring){
  c.save(); c.rotate(t*0.8); c.strokeStyle=k.glow; c.lineWidth=2.5;
  c.shadowColor=k.glow; c.shadowBlur=8;
  c.beginPath(); c.ellipse(0,-s*0.02,s*0.4,s*0.12,0,0,7); c.stroke(); c.restore();
 }
 // orbiting orbs
 for(let i=0;i<(k.orbs||0);i++){
  const a=t*2+i*Math.PI*2/(k.orbs||1);
  const ox=Math.cos(a)*s*0.42, oy=-s*0.02+Math.sin(a)*s*0.18;
  c.save(); c.shadowColor=k.glow; c.shadowBlur=10; c.fillStyle=k.glow;
  c.beginPath(); c.arc(ox,oy,s*0.05,0,7); c.fill(); c.restore();
 }
 // cockpit gem
 if(k.hull!=="core"){
  c.fillStyle="rgba(255,255,255,.85)";
  c.beginPath(); c.arc(-s*0.05,-s*0.08,s*0.07,0,7); c.fill();
 }
 c.restore();
}

// Chassis (ring/treads + hull + accessories + cockpit) for a given skin.
// Shared by the in-game drill and the shop preview thumbnails.
function drawDrillChassis(c,s,skin,t){
 if(skin.design==="elite"){ drawEliteChassis(c,s,skin,t||0); return; }
 // hover ring or treads, depending on design
 if(skin.design==="orb"){
  c.save(); c.shadowColor=skin.glow; c.shadowBlur=12;
  c.strokeStyle=skin.glow; c.lineWidth=3;
  c.beginPath(); c.ellipse(0,s*0.3,s*0.3,s*0.08,0,0,7); c.stroke(); c.restore();
 } else {
  c.fillStyle="#1c1d28"; roundRect(c,-s*0.38,s*0.18,s*0.76,s*0.22,s*0.1); c.fill();
  c.strokeStyle="rgba(255,255,255,.2)"; c.lineWidth=1.5;
  for(let i=-2;i<=2;i++){ c.beginPath(); c.moveTo(i*s*0.13,s*0.2); c.lineTo(i*s*0.13,s*0.38); c.stroke(); }
 }
 // body shape per design
 const bg=c.createLinearGradient(0,-s*0.34,0,s*0.2);
 bg.addColorStop(0,skin.top); bg.addColorStop(1,skin.bot);
 if(skin.glow){ c.shadowColor=skin.glow; c.shadowBlur=14; }
 c.fillStyle=bg;
 c.beginPath();
 switch(skin.design){
  case "borer":   // angular hex hull
   c.moveTo(-s*0.34,0); c.lineTo(-s*0.2,-s*0.3); c.lineTo(s*0.2,-s*0.3);
   c.lineTo(s*0.34,0); c.lineTo(s*0.2,s*0.22); c.lineTo(-s*0.2,s*0.22); c.closePath();
   break;
  case "striker": // low, sleek wedge
   c.moveTo(-s*0.36,s*0.2); c.lineTo(-s*0.22,-s*0.16); c.lineTo(s*0.3,-s*0.16);
   c.lineTo(s*0.36,s*0.2); c.closePath();
   break;
  case "crawler": // heavy slab hull
   roundRect(c,-s*0.38,-s*0.24,s*0.76,s*0.46,s*0.05);
   break;
  case "orb":     // floating sphere
   c.arc(0,-s*0.02,s*0.27,0,7);
   break;
  default:        // rig & crown: rounded cab
   roundRect(c,-s*0.32,-s*0.28,s*0.64,s*0.5,s*0.12);
 }
 c.fill(); c.shadowBlur=0;
 c.strokeStyle="rgba(0,0,0,.35)"; c.lineWidth=1.5; c.stroke();

 // design-specific accessories
 if(skin.design==="crown"){      // golden crown spikes
  c.fillStyle=skin.top;
  for(let i=-1;i<=1;i++){ c.beginPath();
   c.moveTo(i*s*0.16-s*0.06,-s*0.28); c.lineTo(i*s*0.16,-s*0.44);
   c.lineTo(i*s*0.16+s*0.06,-s*0.28); c.closePath(); c.fill(); }
 }
 if(skin.design==="crawler"){    // twin exhaust pipes with embers
  c.fillStyle="#5b2020";
  c.fillRect(-s*0.22,-s*0.4,s*0.08,s*0.18); c.fillRect(s*0.1,-s*0.4,s*0.08,s*0.18);
  c.fillStyle="#ffd54a";
  c.beginPath(); c.arc(-s*0.18,-s*0.44,s*0.035,0,7); c.fill();
  c.beginPath(); c.arc(s*0.14,-s*0.43,s*0.035,0,7); c.fill();
 }
 if(skin.design==="striker"){    // tail fin
  c.fillStyle=skin.bot;
  c.beginPath(); c.moveTo(-s*0.3,-s*0.14); c.lineTo(-s*0.44,-s*0.34); c.lineTo(-s*0.22,-s*0.16);
  c.closePath(); c.fill();
 }
 if(skin.design==="borer"){      // twin side cutters
  c.fillStyle="#c8cdd8";
  c.beginPath(); c.moveTo(-s*0.34,-s*0.06); c.lineTo(-s*0.46,0); c.lineTo(-s*0.34,s*0.06); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(s*0.34,-s*0.06); c.lineTo(s*0.46,0); c.lineTo(s*0.34,s*0.06); c.closePath(); c.fill();
 }
 // cockpit window (orb gets a core instead)
 if(skin.design==="orb"){
  c.fillStyle="#fff"; c.beginPath(); c.arc(0,-s*0.02,s*0.08,0,7); c.fill();
 } else {
  c.fillStyle="#9fe8ff"; c.beginPath(); c.arc(-s*0.08,-s*0.07,s*0.11,0,7); c.fill();
  c.fillStyle="rgba(255,255,255,.7)"; c.beginPath(); c.arc(-s*0.11,-s*0.1,s*0.04,0,7); c.fill();
 }
}
function drawDrillBit(c,s,skin,wob){
 c.save();
 if(skin.design==="crown") c.scale(1.18,1.18);
 c.fillStyle="#c8cdd8";
 c.beginPath(); c.moveTo(s*0.3,-s*0.12+wob); c.lineTo(s*0.56,wob*0.5); c.lineTo(s*0.3,s*0.12+wob); c.closePath(); c.fill();
 c.strokeStyle="#5b6170"; c.lineWidth=1.5;
 for(let i=0;i<3;i++){ const t=0.34+i*0.07;
  c.beginPath(); c.moveTo(s*t,-s*0.1+wob); c.lineTo(s*t,s*0.1+wob); c.stroke(); }
 c.restore();
}

// Pre-rendered shop thumbnails: the REAL drill, not a color swatch.
const skinThumbs={};
function skinThumb(skin){
 if(skinThumbs[skin.id]) return skinThumbs[skin.id];
 const tc=document.createElement("canvas");
 tc.width=tc.height=112;
 const c=tc.getContext("2d");
 c.translate(50,56);            // nudge left so the bit fits
 drawDrillChassis(c,64,skin,0);
 drawDrillBit(c,64,skin,0);
 skinThumbs[skin.id]=tc.toDataURL();
 return skinThumbs[skin.id];
}

function drawDrill(){
 const x=drill.px, y=drill.py-camY, s=TS;
 const [dx,dy]=drill.dir;
 const skin=skinById(S.skin);
 // elite drills shed glowing aura particles
 if(skin.design==="elite"&&Math.random()<0.25){
  parts.push({x:drill.px+TS/2+rand(-TS*0.3,TS*0.3), y:drill.py+TS*0.8,
    vx:rand(-12,12), vy:rand(-34,-12), life:0.6, max:0.6, size:rand(1.5,3), col:skin.glow, grav:0});
 }
 ctx.save(); ctx.translate(x+s/2,y+s/2);
 drawDrillChassis(ctx,s,skin,performance.now()/1000);
 // status light (wings = green, frenzy = gold)
 if(skin.design!=="orb"&&skin.design!=="crown"&&skin.design!=="elite"){
  ctx.strokeStyle="#888"; ctx.beginPath(); ctx.moveTo(s*0.16,-s*0.28); ctx.lineTo(s*0.16,-s*0.4); ctx.stroke();
  ctx.fillStyle=wingsOn()?"#19e3b1":frenzyOn()?"#ffd54a":"#ff5252";
  ctx.beginPath(); ctx.arc(s*0.16,-s*0.42,s*0.045,0,7); ctx.fill();
 }
 // wings powerup: glowing thruster jets under the hull
 if(wingsOn()){
  ctx.save(); ctx.shadowColor="#19e3b1"; ctx.shadowBlur=12; ctx.fillStyle="#19e3b1";
  const j=Math.abs(Math.sin(performance.now()/80))*s*0.1;
  ctx.beginPath(); ctx.moveTo(-s*0.18,s*0.4); ctx.lineTo(-s*0.12,s*0.55+j); ctx.lineTo(-s*0.06,s*0.4); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(s*0.06,s*0.4); ctx.lineTo(s*0.12,s*0.55+j); ctx.lineTo(s*0.18,s*0.4); ctx.closePath(); ctx.fill();
  ctx.restore();
 }
 // drill bit toward movement direction
 ctx.save(); ctx.rotate(dy===-1?-Math.PI/2:dy===1?Math.PI/2:dx===-1?Math.PI:0);
 drawDrillBit(ctx,s,skin,Math.sin(drill.bitSpin*6)*s*0.02);
 ctx.restore();
 ctx.restore();
}

/* =================== HUD =================== */
const elCash=document.getElementById("cash-pill"), elDepth=document.getElementById("depth-pill"),
      elGems=document.getElementById("gems-pill"), elBar=document.getElementById("energy-bar"),
      elWrap=document.getElementById("energy-wrap"), elLabel=document.getElementById("energy-label"),
      elChips=document.getElementById("chips");
function hud(){
 elCash.innerHTML=IC.coin()+"<span>"+fmt(S.cash)+"</span>";
 elDepth.innerHTML=IC.depth()+"<span>"+depthOf(drill.row)+"m</span>";
 elGems.innerHTML=IC.gem()+"<span>"+S.gems+"</span>";
 const frac=S.energy/maxEnergy();
 elBar.style.width=(frac*100)+"%";
 elWrap.classList.toggle("low",frac<0.25);
 elLabel.textContent="ENERGY "+Math.floor(S.energy)+" / "+maxEnergy();
 let chips="";
 if(inLevel) chips+='<div class="chip frenzy">LV '+S.level+" • "+Math.max(0,Math.ceil(levelTimeLeft))+"s • "
   +fmt(levelPot)+"/"+fmt(BAL.levelCash(S.level))+" • "+levelMaxDepth+"/"+BAL.levelDepth(S.level)+"m</div>";
 if(raid) chips+='<div class="chip frenzy">RAID '+Math.max(0,Math.ceil(raid.endAt-nowS()))+"s • "+raid.vaults+" VAULTS • LOOT "+fmt(raid.loot)+"</div>";
 if(wingsOn()) chips+='<div class="chip frenzy">WINGS '+Math.max(0,Math.ceil(S.wingsUntil-nowS()))+"s</div>";
 if(frenzyOn()) chips+='<div class="chip frenzy">FRENZY ×2 • '+dur(S.frenzyUntil-nowS())+"</div>";
 if(boostOn()) chips+='<div class="chip boost">×2 INCOME • '+dur(S.boostUntil-nowS())+"</div>";
 if(!raid&&shieldOn()) chips+='<div class="chip boost">SHIELD '+dur(S.shieldUntil-nowS())+"</div>";
 if(!raid&&S.relics) chips+='<div class="chip relic">RELICS +'+Math.round(S.relics*BAL.relicBonus*100)+"%</div>";
 elChips.innerHTML=chips;
 if(nowS()-comboAt>5){ combo=0; document.getElementById("combo").classList.remove("show"); }
 // raid ticket regen
 while(S.raidTickets<ticketCap()&&nowS()-S.ticketAt>=7200){ S.raidTickets++; S.ticketAt+=7200; }
 if(S.raidTickets>=ticketCap()) S.ticketAt=nowS();
 document.getElementById("btn-social").classList.toggle("leave",!!raid);
 const bombEl=document.getElementById("bomb-count");
 bombEl.textContent=S.bombs;
 document.getElementById("btn-bomb").style.opacity=S.bombs>0?1:0.45;
 const startBtn=document.getElementById("btn-start");
 startBtn.style.display=(!inLevel&&!raid&&!modalOpen)?"block":"none";
 startBtn.textContent="START LEVEL "+S.level;
 document.getElementById("soc-badge").classList.toggle("on",
   !raid&&S.feed.some(f=>f.type==="in"&&!f.revenged));
 document.getElementById("upg-badge").classList.toggle("on", !raid&&
   S.cash>=Math.min(BAL.powerCost(S.up.power),BAL.tankCost(S.up.tank),BAL.regenCost(S.up.regen)));
}

/* =================== Main loop =================== */
let last=performance.now(), saveAt=0;
function loop(t){
 const dt=clamp((t-last)/1000,0,0.05); last=t;
 // movement anim
 if(drill.anim){ const a=drill.anim; a.t+=dt;
  const k=clamp(a.t/a.dur,0,1), e=1-Math.pow(1-k,2);
  drill.px=a.fx+(a.tx-a.fx)*e; drill.py=a.fy+(a.ty-a.fy)*e;
  if(k>=1){ drill.px=a.tx; drill.py=a.ty; drill.anim=null; }
 }
 tryDig(dt);
 if(raid&&nowS()>raid.endAt) endRaid();
 if(inLevel){
  if(!modalOpen&&!adBusy) levelTimeLeft-=dt;   // popups & ads pause the clock
  if(levelPot>=BAL.levelCash(S.level)&&levelMaxDepth>=BAL.levelDepth(S.level)) endLevel(true);
  else if(levelTimeLeft<=0) endLevel(false);
 }
 // energy only — there is no passive income; every coin is earned in a level or raid
 S.energy=clamp(S.energy+BAL.regenRate(S.up.regen)*dt,0,maxEnergy());
 // camera
 const target=drill.py-H*0.42;
 camY+=(Math.max(target,-H*0.78)-camY)*Math.min(1,dt*6);
 shake=Math.max(0,shake-dt*14);
 // particles & floats
 for(let i=parts.length-1;i>=0;i--){ const p=parts[i];
  p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=p.grav*dt;
  if(p.life<=0) parts.splice(i,1); }
 for(let i=floats.length-1;i>=0;i--){ floats[i].life-=dt*0.9; if(floats[i].life<=0) floats.splice(i,1); }
 draw(); hud();
 if(t>saveAt){ save(); saveAt=t+5000; }
 requestAnimationFrame(loop);
}
window.addEventListener("resize",()=>{ resize(); drill.px=drill.col*TS; drill.py=drill.row*TS; });
document.addEventListener("visibilitychange",()=>{ if(document.hidden) save(); });
resize();
drill.px=drill.col*TS; drill.py=drill.row*TS; camY=drill.py-H*0.42;
requestAnimationFrame(loop);
</script>
